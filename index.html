<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição para academia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <form action="https://formspree.io/f/mvkzzgja" method="post">
    <h1>TanGym</h1>

    <!-- Nome e Sobrenome -->
    <div class="campo-grupo">
      <label for="nome">Nome *</label>
      <input type="text" id="nome" name="nome" placeholder="Ex: Lavínia" required>
    </div>

    <div class="campo-grupo">
      <label for="sobrenome">Sobrenome *</label>
      <input type="text" id="sobrenome" name="sobrenome" placeholder="Ex: Mendes" required>
    </div>

    <!-- CPF e Data de Nascimento -->
    <div class="campo-grupo">
      <label for="cpf">CPF *</label>
      <input type="text" id="cpf" name="numero_cpf" placeholder="Ex: xxx.xxx.xxx-xx" maxlength="14" required>
    </div>

    <div class="campo-grupo">
      <label for="data_nascimento">Data de nascimento *</label>
      <input type="date" id="data_nascimento" name="data_nascimento" required>
    </div>

    <!-- Gênero -->
    <div class="campo-grupo">
      <label>Gênero *</label>
      <div style="display: flex; gap: 15px; align-items: center;">
        <div>
          <input type="radio" id="feminino" name="genero" value="Feminino" required>
          <label for="feminino">Feminino</label>
        </div>
        <div>
          <input type="radio" id="masculino" name="genero" value="Masculino">
          <label for="masculino">Masculino</label>
        </div>
        <div>
          <input type="radio" id="outro" name="genero" value="Outro">
          <label for="outro">Outro</label>
        </div>
      </div>
    </div>

    <!-- Nacionalidade -->
    <div class="campo-grupo">
      <label for="nacionalidade">Nacionalidade *</label>
      <select id="nacionalidade" name="nacionalidade" required>
        <option value="Brasil">Brasil</option>
        <option value="Venezuela">Venezuela</option>
        <option value="Uruguai">Uruguai</option>
        <option value="Bolívia">Bolívia</option>
        <option value="Paraguai">Paraguai</option>
      </select>
    </div>

    <!-- Email -->
    <div class="campo-grupo">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="Ex: LaviniaMsj@gmail.com" required>
    </div>

    <!-- Telefone e DDI -->
    <div class="campo-grupo">
      <label for="celular">DDI *</label>
      <div style="display: flex; gap: 10px;">
        <select id="ddi" name="ddi" required style="width: 140px;">
          <option value="+55">+55 (Brasil)</option>
          <option value="+1">+1 (EUA)</option>
          <option value="+34">+34 (Espanha)</option>
          <option value="+591">+591 (Bolívia)</option>
          <option value="+507">+507 (Paraguai)</option>
        </select>
        <label for="celular">Celular *</label>
        <input type="tel" id="celular" name="numero_celular" placeholder="Ex: 99999-9999" style="flex: 1;" required>
      </div>
    </div>

    <!-- Termos / Checkbox -->
    <div class="campo-grupo" style="display: flex; gap: 8px; align-items: flex-start; margin-top: 15px;">
      <input type="checkbox" id="clausulas" name="aceite_comunicacao" value="sim" required>
      <label for="clausulas">Aceito receber comunicações com novidades, promoções e outras informações nos meios de contacto cadastrados.</label>
    </div>

    <button type="submit" style="margin-top: 20px; width: 100%; padding: 12px; font-weight: bold; cursor: pointer;">
      Finalizar meu cadastro
    </button>
  </form>

</body>
</html>
